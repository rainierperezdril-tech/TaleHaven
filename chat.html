<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaleHaven - Discussion</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="images/icon.png">
    <!-- Supabase Library for Realtime Chat Database -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @font-face{
            font-family: "river";
            src: url("../fonts/Riverside-PVwq2.ttf");
        }
        
        body {
            margin: 0;
            background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), url('images/discussionRoom.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Navbar Brand overrides */
        .navbar .nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 10px;
        }

        .navbar .nav-title {
            color: #ffffff !important;
            text-decoration: none !important;
        }

        /* Chat Layout Container spanning edge-to-edge */
        .chat-container {
            display: flex;
            width: 100%;
            max-width: 100%;
            height: calc(100vh - 85px);
            padding: 1.5rem 3rem;
            box-sizing: border-box;
            gap: 3rem;
            justify-content: space-between;
        }

        /* Left Side: Chat History Stream (Container completely removed) */
        .chat-history-side {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages-box {
            flex: 1;
            padding: 0.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Semi-transparent message bubble */
        .chat-message {
            background: rgba(15, 23, 42, 0.35);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border-left: 4px solid #fbbf24;
            backdrop-filter: blur(6px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-user {
            font-weight: bold;
            color: #fbbf24;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        .chat-text {
            color: #f1f5f9;
            font-size: 1rem;
            word-break: break-word;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Right Side: Info / Inputs */
        .chat-control-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: transparent;
            padding: 0.5rem;
            box-sizing: border-box;
        }

        .chat-info h2 {
            font-family: "river";
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        .chat-info p {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 0.95rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }

        /* Input Form Container (Bottom Right) */
        .chat-form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .username-input, .message-input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        .username-input::placeholder, .message-input::placeholder {
            color: #94a3b8;
        }

        .username-input:focus, .message-input:focus {
            border-color: #fbbf24;
            background: rgba(15, 23, 42, 0.65);
        }

        .message-input {
            resize: none;
            height: 90px;
            font-family: inherit;
        }

        /* Golden Yellow Button */
        .send-btn {
            background-color: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            background-color: #f59e0b;
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .chat-container {
                flex-direction: column;
                height: auto;
                padding: 1rem;
            }
            .chat-history-side {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="nav-brand">
                <img src="images/icon.png" alt="Logo Icon">
                <span class="nav-title">TaleHaven</span>
            </a>
        </div>
        <div class="nav-right">
            <a href="index.html">Home</a>
            <a href="create.html">Create</a>
            <a href="read.html">Read</a>
            <a href="chat.html" class="active">Discussion</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <!-- Chat Page Main Layout -->
    <main class="chat-container">
        
        <!-- Left Side: Chat History Stream (No Outer Container) -->
        <section class="chat-history-side">
            <div class="chat-messages-box" id="messages-container">
                <p style="color: #cbd5e1; text-align: center; margin-top: auto; margin-bottom: auto; text-shadow: 0 1px 2px rgba(0,0,0,0.7);">Loading discussion history...</p>
            </div>
        </section>

        <!-- Right Side: Info & Input Controls -->
        <section class="chat-control-side">
            <div class="chat-info">
                <h2>The Tavern Chat</h2>
                <p>Welcome to the community round table! Drop your thoughts, talk about your current reads, or chat with fellow bookworms in real time. Just enter a nickname and join the conversation.</p>
            </div>

            <div class="chat-form">
                <input type="text" id="username-input" class="username-input" placeholder="Your Name / Nickname..." maxlength="30" />
                <textarea id="message-input" class="message-input" placeholder="Type a message..."></textarea>
                <button id="send-btn" class="send-btn">Send Message</button>
            </div>
        </section>

    </main>

    <!-- Realtime Chat Script -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const messagesContainer = document.getElementById("messages-container");
            const usernameInput = document.getElementById("username-input");
            const messageInput = document.getElementById("message-input");
            const sendBtn = document.getElementById("send-btn");

            // Supabase Credentials
            const SUPABASE_URL = 'https://tunotzrdbpnaymihnnqi.supabase.co'; 
            const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_bQUFlg969RQWr3CIjkOwRg_0actcGIL';
            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

            // Fetch existing messages
            async function fetchMessages() {
                const { data, error } = await _supabase
                    .from('global_chat')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) {
                    console.error("Error fetching chat messages:", error);
                    messagesContainer.innerHTML = "<p style='color: #ef4444; text-align: center;'>Failed to load chat history.</p>";
                    return;
                }

                renderMessages(data);
            }

            // Render messages list
            function renderMessages(messages) {
                if (!messages || messages.length === 0) {
                    messagesContainer.innerHTML = "<p style='color: #cbd5e1; text-align: center; margin-top: auto; margin-bottom: auto; text-shadow: 0 1px 2px rgba(0,0,0,0.7);'>No messages yet. Be the first to start the chat!</p>";
                    return;
                }

                messagesContainer.innerHTML = "";
                messages.forEach(msg => {
                    const msgDiv = document.createElement("div");
                    msgDiv.className = "chat-message";
                    msgDiv.innerHTML = `
                        <div class="chat-user">${escapeHtml(msg.username)}</div>
                        <div class="chat-text">${escapeHtml(msg.message)}</div>
                    `;
                    messagesContainer.appendChild(msgDiv);
                });

                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Send message handler
            async function sendMessage() {
                const username = usernameInput.value.trim() || "Anonymous Reader";
                const message = messageInput.value.trim();

                if (!message) return;

                sendBtn.disabled = true;

                const { error } = await _supabase
                    .from('global_chat')
                    .insert([{ username: username, message: message }]);

                if (error) {
                    console.error("Error sending message:", error);
                    alert("Failed to send message.");
                } else {
                    messageInput.value = ""; 
                }

                sendBtn.disabled = false;
            }

            sendBtn.addEventListener("click", sendMessage);
            messageInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Initial load
            fetchMessages();

            // Realtime subscription
            _supabase
                .channel('public:global_chat')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'global_chat' }, payload => {
                    fetchMessages();
                })
                .subscribe();
        });
    </script>
</body>
</html>
